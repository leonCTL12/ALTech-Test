# PostgreSQL profile: run with `-Dspring-boot.run.profiles=postgres` (service)
# or `SPRING_PROFILES_ACTIVE=postgres` (tests). Requires the database from
# docker-compose.yml to be up: `docker compose up -d`.
spring.datasource.url=jdbc:postgresql://localhost:5432/wallet
spring.datasource.username=wallet
spring.datasource.password=wallet

# The schema is always owned by Flyway, never Hibernate — same as the H2 default.
spring.jpa.hibernate.ddl-auto=none