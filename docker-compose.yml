# Wallet Ledger — local PostgreSQL for the `postgres` Spring profile.
#
# Commands:
#   docker compose up -d                start PostgreSQL (creates the `wallet` database)
#   docker compose ps                   wait until the healthcheck reports healthy
#   docker compose down                 stop it (add -v to also delete the data volume)
#
# Run the service against it:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
#
# Run the full test suite against it (proves the Flyway schema is PostgreSQL-portable):
#   SPRING_PROFILES_ACTIVE=postgres ./mvnw test
#
# The same Flyway migration (src/main/resources/db/migration/V1__create_schema.sql)
# runs on PostgreSQL as on H2 — no per-database schema branch exists.
services:
  postgres:
    image: postgres:16-alpine
    container_name: wallet-ledger-postgres
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - wallet-postgres-data:/var/lib/postgresql/data

volumes:
  wallet-postgres-data: